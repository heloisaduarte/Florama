name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Florama.sln

      - name: Build
        run: dotnet build Florama.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Florama.sln --configuration Release --no-build --no-restore --verbosity minimal