name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Florama.sln

      - name: Build
        run: dotnet build Florama.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Florama.sln --configuration Release --no-build --no-restore --verbosity minimal

      - name: Publish
        run: dotnet publish src/Florama.Api/Florama.Api.csproj -c Release -o publish --no-restore

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v2
        with:
          app-name: florama-api
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: publish